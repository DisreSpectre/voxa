<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <title>Orb</title>
  </head>
  <body class="idle lay-taskbar">
    <div class="dock">
      <button id="orb" class="orb" aria-label="Toggle listening">
        <canvas id="orbCanvas" class="orb-canvas"></canvas>
      </button>

      <div class="panel" data-tauri-drag-region>
        <div id="sysstats" class="sysstats hidden" data-tauri-drag-region title="System stats"></div>
        <div class="top" data-tauri-drag-region>
          <button id="btnBack" class="ib back-btn hidden" title="Back to Orb" aria-label="Back to Orb">
            <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
          </button>
          <span id="status" class="status" data-tauri-drag-region>Idle</span>
          <canvas id="wave" class="wave" width="60" height="20" aria-hidden="true"></canvas>
          <span class="brand" id="brand" data-tauri-drag-region></span>
          <div class="top-actions">
            <button id="gear" class="ib" title="Settings" aria-label="Settings">
              <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
            </button>
            <button id="expand" class="ib" title="Open chat" aria-label="Open chat">
              <svg class="ic-chat" viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
            </button>
            <button id="close" class="ib min-btn" title="Minimize to tray" aria-label="Minimize to tray">
              <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="5" y1="12" x2="19" y2="12"/></svg>
            </button>
          </div>
        </div>

        <div id="line" class="line" data-tauri-drag-region>Tap the orb to start</div>

        <div id="feed" class="feed hidden" aria-live="polite"></div>

        <div id="settings" class="settings hidden">
          <div class="settings-tabs" role="tablist">
            <button class="settings-tab active" data-tab="ai" role="tab" type="button">AI &amp; Voice</button>
            <button class="settings-tab" data-tab="look" role="tab" type="button">Theme</button>
            <button class="settings-tab" data-tab="audio" role="tab" type="button">Audio &amp; Mic</button>
          </div>

          <div id="tabAI" class="tab-content active" data-tab="ai" role="tabpanel">
            <label class="set-row">
              <span class="set-l">Key</span>
              <input id="keyInput" class="sel" type="password" placeholder="Paste Gemini key &amp; press Enter" autocomplete="off" />
            </label>
            <label class="set-row">
              <span class="set-l">Model</span>
              <select id="modelSel" class="sel">
                <option value="gemini-2.5-flash-native-audio-preview">Gemini 2.5 Flash Audio</option>
                <option value="gemini-3.1-flash-live-preview">Gemini 3.1 Flash Live</option>
                <option value="gemini-3.8-live">Gemini 3.8 Live</option>
              </select>
            </label>
            <label class="set-row">
              <span class="set-l">Voice</span>
              <select id="voiceSel" class="sel">
                <option value="Aoede">Aoede (Default / Warm)</option>
                <option value="Pore">Pore (Calm)</option>
                <option value="Kore">Kore (Clear)</option>
                <option value="Fenrir">Fenrir (Deep)</option>
                <option value="Zephyr">Zephyr (Bright)</option>
              </select>
            </label>
          </div>

          <div id="tabLook" class="tab-content" data-tab="look" role="tabpanel">
            <label class="set-row">
              <span class="set-l">Theme</span>
              <select id="themeSel" class="sel">
                <option value="black">Black (White Accent)</option>
                <option value="nord">Nord (Nord Blue Accent)</option>
              </select>
            </label>
          </div>

          <div id="tabAudio" class="tab-content" data-tab="audio" role="tabpanel">
            <label class="set-row">
              <span class="set-l">Mic</span>
              <select id="micSel" class="sel"></select>
            </label>
            <label class="set-row tune">
              <span class="set-l">Gain</span>
              <input id="micGain" class="range" type="range" min="0.5" max="6" step="0.1" />
              <span id="micGainVal" class="set-v">1.0×</span>
            </label>
            <div class="set-row tune">
              <span class="set-l">Level</span>
              <span class="meter"><span id="micMeter" class="meter-fill"></span></span>
            </div>
            <label class="set-row tune">
              <span class="set-l">Noise sup.</span>
              <label class="toggle-switch">
                <input id="noiseSuppress" class="chk" type="checkbox" />
                <span class="toggle-slider"></span>
              </label>
              <span class="set-hint">off = picks up quiet speech</span>
            </label>
            <label class="set-row tune">
              <span class="set-l">Auto gain</span>
              <label class="toggle-switch">
                <input id="autoGain" class="chk" type="checkbox" />
                <span class="toggle-slider"></span>
              </label>
              <span class="set-hint">browser AGC</span>
            </label>
            <label class="set-row tune">
              <span class="set-l">Detect</span>
              <select id="vadSel" class="sel">
                <option value="">Default</option>
                <option value="high">High · quiet voice</option>
                <option value="low">Low · loud only</option>
              </select>
            </label>
          </div>
        </div>

        <!-- Live input area — only shown in the expanded chat view -->
        <div id="composer" class="composer hidden">
          <button id="ptt" class="ptt" title="Talk (Ctrl+Space)" aria-label="Toggle voice">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/></svg>
          </button>
          <canvas id="wave2" class="wave2" width="48" height="22" aria-hidden="true"></canvas>
          <input id="composerInput" class="composer-input" type="text" placeholder="Type a message…" autocomplete="off" spellcheck="false" />
          <button id="send" class="send" title="Send" aria-label="Send">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
          </button>
        </div>
        <div id="hint" class="hint hidden">Tip: press Ctrl+Space to talk</div>
      </div>
    </div>

    <!-- Native-style context menu for right-clicking the orb -->
    <div id="contextMenu" class="context-menu hidden">
      <div class="ctx-item" data-action="toggle-talk">
        <span class="ctx-ico">🎙️</span><span id="ctxTalkLabel">Start conversation</span>
      </div>
      <div class="ctx-sep"></div>
      <div class="ctx-sub">
        <div class="ctx-item"><span class="ctx-ico">🎨</span><span>Theme</span><span class="ctx-arr">›</span></div>
        <div class="ctx-sub-menu">
          <div class="ctx-item" data-action="theme-black">⚫ Black (White Accent)</div>
          <div class="ctx-item" data-action="theme-nord">❄️ Nord (Nord Blue Accent)</div>
        </div>
      </div>
      <div class="ctx-item" data-action="toggle-stealth">
        <span class="ctx-ico">👻</span><span id="ctxStealthLabel">Auto-hide Orb (Off)</span>
      </div>
      <div class="ctx-item" data-action="settings">
        <span class="ctx-ico">⚙️</span><span>Settings…</span>
      </div>
      <div class="ctx-item" data-action="reset-pos">
        <span class="ctx-ico">📍</span><span>Reset Position to Bottom-Right</span>
      </div>
      <div class="ctx-sep"></div>
      <div class="ctx-item" data-action="close">
        <span class="ctx-ico">✕</span><span>Quit</span>
      </div>
    </div>

    <script type="module" src="main.js"></script>
  </body>
</html>
